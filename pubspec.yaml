name: threadable_better_player
description: Advanced video player maintained by Threadable with continued Flutter, iOS, and Android support.
version: 2.2.0
homepage: https://github.com/threadable/betterplayer

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_widget_from_html_core: ^0.17.2
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.6
  xml: ^7.0.0
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.threadable.betterplayer
        pluginClass: BetterPlayerPlugin
      ios:
        pluginClass: BetterPlayerPlugin
